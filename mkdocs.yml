site_name: 计算机系统 2 笔记
site_url: https://limingyu-jpg.github.io/ComputerSystem-Notes/
repo_name: limingyu-jpg/ComputerSystem-Notes
repo_url: https://github.com/limingyu-jpg/ComputerSystem-Notes
docs_dir: .build/docs
site_dir: .build/site
theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换浅色模式
  features:
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
nav:
  - 首页: README.md
  - "硬件：ISA、流水线与体系结构": "笔记/硬件.md"
  - "硬件代码": "笔记/硬件代码.md"
  - "软件：操作系统": "笔记/软件.md"
plugins:
  - search:
      lang: [en, zh]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - sane_lists
  - toc:
      permalink: true
      toc_depth: 2-4
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
